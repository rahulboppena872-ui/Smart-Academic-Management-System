{% extends "base.html" %}{% block content %}<h2>Leave Approval Center</h2><table class="table"><tr><th>Faculty</th><th>Date</th><th>Type</th><th>Reason</th><th>Status</th><th>Action</th></tr>{% for l in leaves %}<tr><td>{{l.faculty.user.name}}</td><td>{{l.leave_date}}</td><td>{{l.leave_type}}</td><td>{{l.reason}}</td><td>{{l.status}}</td><td>{% if l.status=='pending' %}<form class="d-inline" method="post" action="{{url_for('main.process_leave',id=l.id,action='approve')}}"><button class="btn btn-sm btn-success">Approve</button></form><form class="d-inline" method="post" action="{{url_for('main.process_leave',id=l.id,action='reject')}}"><button class="btn btn-sm btn-danger">Reject</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
