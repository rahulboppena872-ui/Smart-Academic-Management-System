<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Academic Management</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('main.static',filename='css/style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">🎓 Smart Academic</a>
{% if session.get('user_id') %}<div class="d-flex gap-2 align-items-center"><span class="text-white">{{session.get('name')}} · {{session.get('role')}}</span><a class="btn btn-outline-light btn-sm" href="{{url_for('main.notifications')}}">🔔</a><a class="btn btn-light btn-sm" href="{{url_for('main.logout')}}">Logout</a></div>{% endif %}</div></nav>
<div class="container py-4">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
