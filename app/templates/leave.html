{% extends "base.html" %}{% block content %}<h2>Leave / Emergency Leave</h2><form method="post" class="card p-3 mb-4"><input class="form-control my-2" type="date" name="leave_date" required><select class="form-select my-2" name="leave_type"><option value="normal">Normal Leave</option><option value="emergency">Emergency Leave</option></select><textarea class="form-control my-2" name="reason" placeholder="Reason" required></textarea><button class="btn btn-primary">Submit</button></form>
<table class="table"><tr><th>Date</th><th>Type</th><th>Reason</th><th>Status</th></tr>{% for l in leaves %}<tr><td>{{l.leave_date}}</td><td>{{l.leave_type}}</td><td>{{l.reason}}</td><td>{{l.status}}</td></tr>{% endfor %}</table>{% endblock %}
